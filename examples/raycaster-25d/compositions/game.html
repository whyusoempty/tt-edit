        mapLines(LA, sx, sy, s, cx, cy, 0, VH, (w) => (w.kind === "out" ? cOut : w.kind === "in" ? cIn : w.kind === "hall" ? cHall : w.kind === "pillar" ? cPil : w.kind === "door" ? cDoor : null));
        // player arrow
        const px = sx + (cam.x - cx) * s, py = sy + (cam.y - cy) * s, a = cam.yaw, L = 7;
        const c = WHITE[0];
        line(px - Math.cos(a) * L, py - Math.sin(a) * L, px + Math.cos(a) * L, py + Math.sin(a) * L, c, VH);
        line(px + Math.cos(a) * L, py + Math.sin(a) * L, px + Math.cos(a + 2.5) * 4, py + Math.sin(a + 2.5) * 4, c, VH);
        line(px + Math.cos(a) * L, py + Math.sin(a) * L, px + Math.cos(a - 2.5) * 4, py + Math.sin(a - 2.5) * 4, c, VH);
        drawText("MAP05", 292 - textW("MAP05", 1), 248, 1, GREY, false, VH);
      }
      let HEADMASK = null;
      function drawIntermission(t) {
        const ct = TX.carpets[1];
        const s = 5.0, sx = 150, sy = 182, cx = HEADC[0], cy = HEADC[1];
        if (!HEADMASK) {
          HEADMASK = new Uint8Array(W * H);
          const poly = OUT.map((p) => [sx + (p[0] * S - cx) * s, sy + (p[1] * S - cy) * s]);
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            let ins = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
              const a = poly[i], b = poly[j];
              if (a[1] > y + 0.5 !== b[1] > y + 0.5 && x + 0.5 < ((b[0] - a[0]) * (y + 0.5 - a[1])) / (b[1] - a[1]) + a[0]) ins = !ins;
            }
            HEADMASK[y * W + x] = ins ? 1 : 0;
          }
        }
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          const c = ct.d[((y % 88) + 8) * 64 + (x % 64)];
          const inside = HEADMASK[y * W + x];
          fb[y * W + x] = inside ? shade(c, 0.12, 0.1, 0.12) : shade(c, 0.36, 0.3, 0.32);
        }
        mapLines(LA, sx, sy, s, cx, cy, 0, H, (w) => (w.kind === "out" ? HQ(0xd83a24) : w.kind === "in" ? HQ(0x7a3a1c) : w.kind === "hall" ? HQ(0x9a7030) : w.kind === "pillar" ? HQ(0xc0b050) : null));
        // you are here
        if (frameOf(t) % 10 < 6) {
          const px = sx + (HALL.x - cx) * s, py = sy + (HALL.y - cy) * s;
          drawText("X", Math.round(px - 4), Math.round(py - 5), 1, HOT, true);
        }
        drawText("ENTERING", Math.round((W - textW("ENTERING", 1)) / 2), 12, 1, GREY, true);
        const ln = [["В", 21.74], ["ЦАРСТВО", 21.76], ["СНОВ", 22.3]];
        drawWords(ln, Math.round((W - textW("В ЦАРСТВО СНОВ", 2)) / 2), 28, t, H);
      }

      // ---------------- scenes ----------------
      function hitTint(t) {
        TK = 0; TR = 255; TG = 40; TB = 24;
        for (const h of HITS) if (t >= h && t < h + 0.3) TK = Math.max(TK, 0.3 * (1 - (t - h) / 0.3));
      }
      function sceneA(t) {
        hitTint(t);
        const cam = camA(t);
        LA.update(t, cam);
        if (t >= 1.14 && t < 2.21) drawAutomap(t, cam);
        else { renderView(LA, cam, 0, 0, W, VH); TK = 0; drawIdlePhone(t, cam, 0); }
        TK = 0;
        drawStatus(t);
        drawMessages(t);
      }
      function dim(x0, y0, w, h, k) {
        if (k >= 1) return;
        for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
          const c = fb[y * W + x];
          fb[y * W + x] = Q((c & 255) * k, ((c >> 8) & 255) * k, ((c >> 16) & 255) * k);
        }
      }
      let BORDER = null;
      function drawBorder(vx, vy, vw, vh) {
        if (!BORDER) {
          BORDER = new Uint32Array(W * VH);
          const ct = TX.carpets[0];
          for (let y = 0; y < VH; y++) for (let x = 0; x < W; x++) BORDER[y * W + x] = shade(ct.d[((y % 88) + 8) * 64 + (x % 64)], 0.5, 0.45, 0.45);
        }
        for (let y = 0; y < VH; y++) for (let x = 0; x < W; x++) {
          if (x >= vx && x < vx + vw && y >= vy && y < vy + vh) continue;
          fb[y * W + x] = BORDER[y * W + x];
        }
        const hi = HQ(0x8a7a66), lo = HQ(0x0a0606);
        fillR(vx - 1, vy - 1, vw + 2, 1, lo); fillR(vx - 1, vy - 1, 1, vh + 2, lo);
        fillR(vx - 1, vy + vh, vw + 2, 1, hi); fillR(vx + vw, vy - 1, 1, vh + 2, hi);
      }
      function sceneB(t) {
        TK = 0;
        const cam = camB(t);
        LB_.update(t);
        const k = step(SHRINK, t, 1);
        const vw = Math.round((W * k) / 2) * 2, vh = Math.round((VH * k) / 2) * 2, vx = (W - vw) / 2, vy = (VH - vh) / 2;
        const P = renderView(LB_, cam, vx, vy, vw, vh);
        drawSnow(cam, t, vx, vy, vw, vh, P);
        // weapon: idle -> lowered -> raised phone -> lowered
        if (t < 15.45) drawIdlePhone(t, cam, 0);
        else if (t < 15.58) drawIdlePhone(t, cam, Math.round(((t - 15.45) / 0.13) * 110));
        else if (t < 18.94) drawRaisedPhone(t, Math.round((1 - sm((t - 15.58) / 0.2)) * 250));
        else if (t < 19.2) drawRaisedPhone(t, Math.round(sm((t - 18.94) / 0.26) * 260));
        if (k < 1) {
          // clip anything drawn outside the shrinking window, then the carpet border
          drawBorder(vx, vy, vw, vh);
          for (const s of SHRINK) if (t >= s[0] && t < s[0] + 2 / FPS) fillR(vx, vy, vw, vh, HQ(0x000000));
          if (t >= 21.2) dim(vx, vy, vw, vh, clamp(1 - (t - 21.2) / 0.5, 0, 1));
        }
        drawStatus(t);
        drawMessages(t);
      }
      function sceneI(t) {
        TK = 0;
        drawIntermission(t);
      }
      function sceneC(t) {
        TK = 0;
        const cam = camC(t);
        LC.update(t);
        renderView(LC, cam, 0, 0, W, VH);
        drawStatus(t);
        drawMessages(t);
      }
      function compose(t) {
        if (t < CUT_B) sceneA(t);
        else if (t < CUT_I) sceneB(t);
        else if (t < CUT_C) sceneI(t);
        else sceneC(t);
      }
      // the old-engine screen melt between levels
      const MELTS = [CUT_B, CUT_I, CUT_C];
      const meltCache = {};
      const meltStart = {};
      function meltOffsets(m) {
        if (meltStart[m]) return meltStart[m];
        const st = new Float32Array(W / 2);
        st[0] = -hash(m * 7.1) * 24;
        for (let i = 1; i < W / 2; i++) st[i] = clamp(st[i - 1] + (hash(m * 3.3 + i * 1.91) * 3 - 1.5) * 3, -24, 0);
        return (meltStart[m] = st);
      }
      function frame(t) {
        for (const m of MELTS) {
          if (t >= m && t < m + 0.75) {
            if (!meltCache[m]) { compose(m - 1 / FPS); meltCache[m] = fb.slice(); }
            compose(t);
            const old = meltCache[m], st = meltOffsets(m);
            const ticks = Math.floor((t - m) * 45);
            for (let c = 0; c < W / 2; c++) {
              let y = st[c];
              for (let k = 0; k < ticks; k++) { if (y < 0) y += 3; else if (y < H) y += y < 24 ? y + 3 : 16; }
              const off = Math.max(0, Math.floor(y));
              for (let xx = c * 2; xx < c * 2 + 2; xx++) for (let yy = H - 1; yy >= off; yy--) fb[yy * W + xx] = old[(yy - off) * W + xx];
            }
            return;
          }
        }
        compose(t);
      }

      // ---------------- build & present ----------------
      const small = document.createElement("canvas"); small.width = W; small.height = H;
      const sctx = small.getContext("2d");
      const img = new ImageData(new Uint8ClampedArray(fb.buffer), W, H);
      const out = document.getElementById("screen"), octx = out.getContext("2d");
      function present() {
        sctx.putImageData(img, 0, 0);
        octx.imageSmoothingEnabled = false;
        octx.drawImage(small, 0, 0, 1500, 1500);
      }
      function build() {
        buildLUT();
        buildGlyphs();
        const g = (arr) => arr.map((h) => HQ(h));
        RED = g([0xffd0a0, 0xffc090, 0xffa070, 0xff8858, 0xf06a40, 0xe05030, 0xc83a22, 0xb02a18, 0x8a1e10, 0x701408]);
        HOT = g([0xffffff, 0xfffff0, 0xfff0d0, 0xffe0b0, 0xffd090, 0xffc080, 0xffb070, 0xffa060, 0xff9050, 0xff8040]);
        GREY = g([0xc8bca8, 0xc0b4a0, 0xb8ac98, 0xb0a490, 0xa89c88, 0xa09480, 0x988c78, 0x908470, 0x887c68, 0x807460]);
        WHITE = g([0xffffff]); PALE = g([0xb0c0d8]); BLUE = g([0x5288c1]); GOLD = g([0xe0c060]);
        const stt = statusTex(); STATUS_T = new Uint32Array(300 * 40);
        for (let i = 0; i < 300 * 40; i++) STATUS_T[i] = shade(stt.d[i], 1, 1, 1);
        LA = buildA(); LB_ = buildB(); LC = buildC();
      }
      let built = false, pending = null;
      function renderAt(t) {
        if (!built) { pending = t; return; }
        t = clamp(t, 0, DUR - 1e-4);
        frame(t);
        present();
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.load('16px "PS2P"', "АБВ").then(() => document.fonts.ready).then(() => {
        build();
        built = true;
        renderAt(pending == null ? 0 : pending);
        window.__doomBuilt && window.__doomBuilt();
      });
    })();
  </script>
</template>
