    K(0.0, SEAT, [0.24, 1.08, 2.4], { hold: true });
    K(0.55, SEAT, [0.24, 1.03, 2.5], { hold: true });
    K(1.0, SEAT, [1.25, 1.12, 3.75], { hold: true });
    K(1.18, SEAT, [1.3, 1.1, 3.8], { hold: true });
    K(1.6, SEAT, [1.86, 1.08, 4.5], { hold: true });
    K(2.18, SEAT, [1.86, 1.1, 4.5], { hold: true });
    // 2. get up, walk out to the entry door
    K(2.55, [1.13, 1.62, 2.68], [1.8, 1.32, 4.7]);
    K(3.0, [1.52, 1.62, 3.38], [1.8, 1.4, 6.2]);
    K(3.38, [1.76, 1.62, 4.08], [1.78, 1.38, 7.6]);
    K(3.92, [1.8, 1.62, 5.15], [1.79, 1.32, 7.6]);
    K(4.45, [1.79, 1.62, 6.28], [1.9, 1.22, 7.6]);
    K(4.88, [1.78, 1.62, 6.82], [1.98, 1.14, 7.6], { hold: true });
    K(5.38, [1.78, 1.62, 6.85], [1.97, 1.12, 7.6], { hold: true });
    // 3. hesitates at the peephole, then spins round
    K(5.9, [1.79, 1.6, 7.17], [1.78, 1.55, 7.62], { hold: true });
    K(6.38, [1.79, 1.6, 7.2], [1.78, 1.53, 7.62], { hold: true });
    K(6.9, [1.8, 1.62, 7.05], [1.8, 1.28, 4.0], { turn: -1 });
    K(7.62, [1.8, 1.62, 7.14], [1.79, 1.24, 4.0], { hold: true });
    K(8.05, [1.82, 1.62, 6.3], [2.6, 1.2, 5.0]);
    K(8.42, [1.8, 1.62, 5.55], [3.7, 1.1, 4.45]);
    K(8.78, [1.79, 1.62, 4.78], [1.82, 1.36, 2.0]);
    K(9.05, [1.83, 1.62, 3.55], [0.3, 1.3, 3.0], { turn: 1 });
    K(9.38, [1.86, 1.62, 3.02], DOOR, { turn: 1, hold: true });
    K(9.98, [1.86, 1.62, 2.98], DOOR, { hold: true });
    // the circle round the room
    K(10.36, [1.86, 1.62, 2.95], [3.6, 1.5, 2.9], { turn: 1, hold: true });
    K(10.62, [1.86, 1.62, 2.95], [3.6, 1.45, 2.88], { hold: true });
    K(10.95, [1.86, 1.62, 2.95], [3.0, 0.6, 1.0], { turn: 1 });
    K(11.3, [1.86, 1.62, 2.95], MON, { turn: 1 });
    K(11.86, [1.86, 1.62, 2.95], DOOR, { turn: 1, hold: true });
    K(12.22, [1.85, 1.62, 3.12], DOOR, { hold: true });
    // 4. the clock
    K(12.95, [2.55, 1.27, 3.36], [2.79, 0.89, 3.72], { hold: true });
    K(13.95, [2.57, 1.26, 3.38], [2.79, 0.89, 3.72], { hold: true });
    K(14.22, [2.6, 1.28, 3.36], [3.16, 0.84, 3.72], { hold: true });
    K(14.5, [2.6, 1.3, 3.34], [3.16, 0.84, 3.72], { hold: true });
    // back up to the bed and sit, eyes on the door
    K(15.0, [2.56, 1.52, 2.15], [1.75, 1.0, 4.08], { turn: -1 });
    K(15.4, [2.52, 1.1, 1.55], [1.75, 0.95, 4.08], { yawOff: -0.27, pitchOff: -0.05, hold: true });
    K(19.05, [2.52, 1.09, 1.56], [1.75, 0.95, 4.08], { yawOff: -0.25, pitchOff: -0.07, hold: true });
    // 6. lamp off, lie down facing the door
    K(19.48, [2.53, 1.08, 1.5], [2.06, 0.8, 0.2], { turn: -1, hold: true });
    K(19.76, [2.53, 1.07, 1.5], [2.06, 0.78, 0.2], { hold: true });
    K(20.25, [2.82, 1.0, 0.95], [2.1, 0.88, 2.8], { turn: 1, roll: -0.22 });
    K(20.8, [3.0, 0.88, 0.5], [1.68, 1.02, 4.25], { turn: 1, roll: -0.4, hold: true });
    K(26.68, [3.0, 0.885, 0.51], [1.68, 1.02, 4.25], { roll: -0.42, hold: true });

    function makeTrack(ks) {
      const n = ks.length, dim = ks[0].v.length;
      const tan = ks.map((k, i) => {
        if (k.hold || i === 0 || i === n - 1) return new Array(dim).fill(0);
        const a = ks[i - 1], b = ks[i + 1];
        return k.v.map((v, j) => {
          const s0 = (v - a.v[j]) / (k.t - a.t), s1 = (b.v[j] - v) / (b.t - k.t);
          if (s0 * s1 <= 0) return 0;
          return (2 * s0 * s1) / (s0 + s1);
        });
      });
      return (t) => {
        let i = 0;
        if (t <= ks[0].t) i = 0; else if (t >= ks[n - 1].t) i = n - 2; else while (ks[i + 1].t < t) i++;
        const a = ks[i], b = ks[i + 1], dt = b.t - a.t, u = clamp((t - a.t) / dt, 0, 1);
        const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
        return a.v.map((v, j) => h00 * v + h10 * dt * tan[i][j] + h01 * b.v[j] + h11 * dt * tan[i + 1][j]);
      };
    }
    const camTrack = makeTrack(keys);
    // footsteps: integrate horizontal speed once into a step phase
    const SR = 240, NS = Math.ceil(DUR * SR) + 4;
    const bobPh = new Float32Array(NS), bobW = new Float32Array(NS);
    (function () {
      let ph = 0, w = 0, prev = camTrack(0);
      for (let i = 0; i < NS; i++) {
        const s = camTrack(i / SR);
        const sp = i ? Math.hypot(s[0] - prev[0], s[2] - prev[2]) * SR : 0;
        prev = s; ph += (sp / SR / 0.74) * Math.PI;
        const target = clamp((sp - 0.25) / 1.2, 0, 1);
        w += (target - w) * (1 - Math.exp(-1 / SR / 0.1));
        bobPh[i] = ph; bobW[i] = w;
      }
    })();
    const look = (t, a, b, c) => Math.sin(t * a) * 0.5 + Math.sin(t * b + 1.3) * 0.3 + Math.sin(t * c + 2.1) * 0.2;
    function cameraAt(t) {
      const s = camTrack(t);
      const fi = clamp(t * SR, 0, NS - 2), i0 = Math.floor(fi), f = fi - i0;
      const ph = lerp(bobPh[i0], bobPh[i0 + 1], f), w = lerp(bobW[i0], bobW[i0 + 1], f);
      let [x, y, z, yaw, pitch, roll] = s;
      const side = Math.sin(ph) * 0.02 * w;
      y += (0.014 - Math.abs(Math.sin(ph)) * 0.03) * w;
      x += Math.cos(yaw) * side; z -= Math.sin(yaw) * side;
      roll += Math.sin(ph) * 0.007 * w;
      pitch += Math.sin(ph * 2) * 0.005 * w;
      // breathing and hand drift
      const lying = t > 20.6 ? 1 : 0;
      const br = Math.sin(t * 2 * Math.PI * (lying ? 0.2 : 0.26));
      y += br * (lying ? 0.006 : 0.004);
      yaw += 0.006 * look(t, 0.71, 1.37, 2.3);
      pitch += 0.005 * look(t, 0.53, 1.11, 1.9) + br * 0.003;
      // door rattle shake
      if (t >= T_RATTLE && t < T_RATTLE + 0.4) { const k = 1 - (t - T_RATTLE) / 0.4; yaw += 0.006 * Math.sin(t * 71) * k; pitch += 0.005 * Math.sin(t * 53) * k; }
      // startled flinch when the shape crosses
      if (t >= 7.05 && t < 7.6) { const k = Math.sin(((t - 7.05) / 0.55) * Math.PI); z += 0.03 * k; pitch += 0.01 * k; }
      camera.position.set(x, y, z);
      camera.rotation.set(pitch, yaw, roll);
      camera.updateMatrixWorld();
    }

    // ---------- state over time ----------
    const DEG = Math.PI / 180;
    function doorAngle(t) {
      if (t < T_CLOSE[0]) return 96 * DEG;
      if (t < T_CLOSE[1]) { const u = (t - T_CLOSE[0]) / (T_CLOSE[1] - T_CLOSE[0]); return 96 * DEG * (1 - u * u * (3 - 2 * u)); }
      if (t < T_CREEP[0]) return 0;
      if (t < FIG_DOOR[0]) return 24 * DEG * smooth((t - T_CREEP[0]) / (T_CREEP[1] - T_CREEP[0]));
      return 55 * DEG;
    }
    function lidAt(t) {
      return clamp(env([[0, 0], [19.3, 0], [19.45, 0.55], [19.62, 0.08], [19.92, 0.14], [20.12, 0.68], [20.34, 0.24], [20.78, 0.3], [21.02, 0.74], [21.26, 0.36], [21.58, 0.62], [21.74, 1.0], [21.96, 1.0], [22.2, 0.34],
        [22.36, 0.4], [22.56, 0.95], [22.72, 0.95], [22.96, 0.38], [23.4, 0.46], [23.57, 1.0], [23.73, 1.0], [23.96, 0.4], [24.24, 0.52], [24.4, 1.0], [24.62, 1.0], [24.82, 0.36], [25.22, 0.42], [25.62, 1.0], [27, 1.0]], t), 0, 1);
    }
    const blurAt = (t) => env([[0, 0], [19.2, 0], [20.0, 0.16], [21.0, 0.3], [22.6, 0.38], [27, 0.42]], t);
    const fadeAt = (t) => (t < 0.55 ? smooth(t / 0.55) : t >= T_BLACK ? 0 : 1);
    function glitchAt(t) {
      for (const [a, b] of [[6.5, 6.6], [11.86, 11.93], [21.74, 21.84], [24.42, 24.5]]) if (t >= a && t < b) return 1;
      return 0;
    }
    function figureAt(t, F) {
      F.root.visible = false;
      let x = 0, z = 0, dir = 0, walk = 0, ph = 0;
      if (inWin(t, WALK1)) {
        const u = (t - WALK1[0]) / (WALK1[1] - WALK1[0]);
        x = lerp(0.95, 2.8, u); z = lerp(2.28, 2.18, u); dir = Math.PI / 2; walk = 1; ph = (t - WALK1[0]) * 2 * Math.PI * 1.9;
      } else if (inWin(t, PASS2)) {
        const u = (t - PASS2[0]) / (PASS2[1] - PASS2[0]);
        const a = [2.62, 4.95], b = [1.5, 5.05], c = [1.32, 6.1];
        if (u < 0.6) { const k = u / 0.6; x = lerp(a[0], b[0], k); z = lerp(a[1], b[1], k); dir = -Math.PI / 2; }
        else { const k = (u - 0.6) / 0.4; x = lerp(b[0], c[0], k); z = lerp(b[1], c[1], k); dir = lerp(-Math.PI / 2, 0, smooth(k * 2)); }
        walk = 1; ph = (t - PASS2[0]) * 2 * Math.PI * 1.7;
      } else if (inWin(t, FIG_DOOR)) {
        // in the gap between the jamb and the door leaf, against the moonlit hallway wall
        x = 1.42; z = 4.55; dir = Math.atan2(3.0 - 1.42, 0.5 - 4.55);
      } else if (t >= FIG_BED) {
        // past the foot of the bed, in line with the door gap, the clock glowing beside it
        x = 2.03; z = 2.98; dir = Math.atan2(3.0 - 2.03, 0.5 - 2.98);
      } else return;
      F.root.visible = true;
      F.root.position.set(x, walk ? Math.abs(Math.cos(ph)) * 0.022 - 0.01 : 0, z);
      F.root.rotation.y = dir;
      F.body.rotation.x = walk ? 0.05 : 0.03;
      F.legs.forEach((l, i) => (l.rotation.x = walk ? Math.sin(ph + i * Math.PI) * 0.36 : 0));
      F.knees.forEach((k, i) => (k.rotation.x = walk ? 0.08 + 0.55 * Math.max(0, -Math.cos(ph + i * Math.PI)) : 0.03));
      F.arms.forEach((a, i) => (a.rotation.x = walk ? -Math.sin(ph + i * Math.PI) * 0.28 : 0.03));
      F.elbows.forEach((e) => (e.rotation.x = walk ? -0.22 : -0.08));
    }

    function renderAt(t) {
      if (!built) { pending = t; return; }
      t = clamp(t, 0, DUR);
      const f = frameOf(t);
      cameraAt(t);
      // doors and props
      S.hinge.rotation.y = doorAngle(t);
      const rat = t >= T_RATTLE && t < T_RATTLE + 0.32 ? Math.sin(((t - T_RATTLE) / 0.32) * Math.PI * 2) : 0;
      S.handle.rotation.z = -Math.abs(rat) * 0.45;
      // lights
      const lampOn = t < T_LAMP_OFF ? 1 : 0;
      S.lamp.intensity = 3.4 * lampOn; S.lampFill.intensity = 1.5 * lampOn; S.shadeMat.emissiveIntensity = 1.2 * lampOn;
      S.bulbMat.color.setRGB(lampOn ? 4 : 0.03, lampOn ? 3.2 : 0.03, lampOn ? 2.2 : 0.03);
      const monFlick = hash1(f * 0.37 + 11) < 0.03 ? 0.85 : 1;
      S.mon.intensity = 1.4 * monFlick; S.scrMat.emissiveIntensity = 0.95 * monFlick;
      const lit = t >= T_PHONE_LIT && t < T_PICK;
      S.phMat.emissiveIntensity = lit ? 1.1 : 0; S.phL.intensity = lit ? 0.08 : 0;
      S.phone.visible = t < T_PICK;
      drawMonitor(S.scr, t); drawClock(S.ck, t); drawMicro(S.mw, t);
      figureAt(t, S.fig);
      // post
      const lid = lidAt(t);
      compMat.uniforms.uLid.value = lid;
      compMat.uniforms.uBlur.value = blurAt(t);
      compMat.uniforms.uFade.value = fadeAt(t);
      compMat.uniforms.uGlitch.value = glitchAt(t);
      compMat.uniforms.uFrame.value = f % 977;
      compMat.uniforms.uExp.value = env([[0, 1.6], [T_LAMP_OFF, 1.6], [T_LAMP_OFF + 0.05, 1.2], [21.0, 3.3], [27, 3.5]], t);
      compMat.uniforms.uVig.value = env([[0, 0.62], [19.2, 0.62], [21.0, 0.78], [27, 0.82]], t);
      brightMat.uniforms.uExp.value = compMat.uniforms.uExp.value;
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      brightMat.uniforms.tSrc.value = rtScene.texture; pass(brightMat, rtA);
      blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.dir.value.set(1 / BW, 0); pass(blurMat, rtB);
      blurMat.uniforms.tSrc.value = rtB.texture; blurMat.uniforms.dir.value.set(0, 1 / BW); pass(blurMat, rtA);
      blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.dir.value.set(2 / BW, 0); pass(blurMat, rtB);
      blurMat.uniforms.tSrc.value = rtB.texture; blurMat.uniforms.dir.value.set(0, 2 / BW); pass(blurMat, rtA);
      pass(compMat, null);
    }

    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    fontsReady.then(() => {
      build();
      built = true;
      renderAt(pending ?? (window.__hfThreeTime || 0));
      window.__ftfWorldBuilt && window.__ftfWorldBuilt();
    });
  </script>
