      g.bezierCurveTo(cx + 150 * k, cy - 156 * k, cx + 166 * k, cy - 84 * k, cx + 152 * k, cy - 40 * k);
      g.lineTo(cx + 190 * k, cy + 30 * k); g.lineTo(cx + 152 * k, cy + 48 * k); g.lineTo(cx + 162 * k, cy + 76 * k); g.lineTo(cx + 146 * k, cy + 92 * k);
      g.bezierCurveTo(cx + 152 * k, cy + 132 * k, cx + 112 * k, cy + 152 * k, cx + 62 * k, cy + 152 * k);
      g.lineTo(cx + 42 * k, cy + 220 * k); g.closePath();

    function maze(g, x0, y0, cols, rows, cell, seed, color, lw) {
      const r = mulberry32(seed), vis = new Uint8Array(cols * rows), wallsR = new Uint8Array(cols * rows).fill(1), wallsB = new Uint8Array(cols * rows).fill(1);
      const st = [0]; vis[0] = 1;
      while (st.length) {
        const c = st[st.length - 1], cx = c % cols, cy = Math.floor(c / cols), nb = [];
        if (cx > 0 && !vis[c - 1]) nb.push([c - 1, "L"]); if (cx < cols - 1 && !vis[c + 1]) nb.push([c + 1, "R"]);
        if (cy > 0 && !vis[c - cols]) nb.push([c - cols, "U"]); if (cy < rows - 1 && !vis[c + cols]) nb.push([c + cols, "D"]);
        if (!nb.length) { st.pop(); continue; }
        const [n, d] = nb[Math.floor(r() * nb.length)];
        if (d === "R") wallsR[c] = 0; if (d === "L") wallsR[n] = 0; if (d === "D") wallsB[c] = 0; if (d === "U") wallsB[n] = 0;
        vis[n] = 1; st.push(n);

      g.strokeStyle = color; g.lineWidth = lw; g.lineCap = "square"; g.beginPath();
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {

      g.moveTo(x0, y0); g.lineTo(x0 + cols * cell, y0); g.moveTo(x0, y0); g.lineTo(x0, y0 + rows * cell);
      g.stroke();

      const lidKeys = [[19.55, 0], [19.78, 0.42], [20.0, 0.0], [20.95, 0.0], [21.15, 0.5], [21.4, 0.0], [22.4, 0.0], [22.66, 1.0], [22.98, 1.0], [23.4, 0.0]];
      for (let i = 0; i < lidKeys.length - 1; i++) { const [t0, v0] = lidKeys[i], [t1, v1] = lidKeys[i + 1]; if (t >= t0 && t < t1) lid = lerp(v0, v1, smooth((t - t0) / (t1 - t0))); }
      if (t >= T.DARK - 0.4) expo = 1.3;
      if (t >= T.OFF && t < T.RESET) fade = 0;
      compM.uniforms.uExpo.value = expo; compM.uniforms.uLid.value = lid; compM.uniforms.uFade.value = fade; compM.uniforms.uFrame.value = f % 997;
      pass(compM, null);
    }

    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    window.__exDebug = { renderAt, S, camera, scene, lamps, camAt };
    build();
  </script>
</template>
