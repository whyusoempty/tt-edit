  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";

    // =====================================================================
    // timing (from ../transcript/TRANSCRIPT.md)
    // =====================================================================
    const DUR = 26.68, FPS = 30, W = 300;
    const CUT = {
      B: 1.40, M1: 2.22, C1: 3.96, C2: 4.70, D: 5.32, E: 6.30, F: 7.30, G: 8.60, M2: 9.22,
      BLK: 12.12, H1: 12.28, H2: 13.0, I1: 15.44, I2: 16.45, I3: 19.10, J1: 22.74, J2: 23.40, J3: 24.05, K: 24.38,
    };
    // transitions: "mix" dissolves from the last frame of the outgoing shot, "dip" goes through black
    const TRANS = [
      [CUT.B, 0.5, "mix"], [CUT.M1, 0.35, "mix"], [CUT.C1, 0.45, "mix"], [CUT.C2, 0.4, "mix"], [CUT.D, 0.4, "mix"], [CUT.E, 0.45, "mix"],
      [CUT.F, 0.5, "dip"], [CUT.M2, 0.35, "mix"], [CUT.H2, 0.5, "mix"], [CUT.I1, 0.5, "dip"], [CUT.I2, 0.4, "mix"], [CUT.I3, 0.55, "mix"],
      [CUT.J1, 0.5, "dip"], [CUT.J2, 0.4, "mix"], [CUT.J3, 0.3, "mix"], [CUT.K, 0.5, "mix"],
    ];
    const T_PYAT = 13.20, T_OFF = 14.08, T_ON = 14.38, T_SNOV = 22.30, T_END = 26.36;

    // =====================================================================
    // helpers
    // =====================================================================
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function hash1(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, u) => a + (b - a) * u;
    const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
    const frameOf = (t) => Math.floor(t * FPS + 1e-4);
    const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
    function env(keys, t) {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
        if (t < t1) return lerp(v0, v1, smooth((t - t0) / (t1 - t0)));
      }
      return keys[keys.length - 1][1];
    }
    const v3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);
    const lerp3 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];

    function cnv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
    function ctx(c) { const g = c.getContext("2d", { willReadFrequently: true }); g.imageSmoothingEnabled = false; return g; }
    function tx(c, rep, linear) {
      const t = new THREE.CanvasTexture(c);
      t.magFilter = linear ? THREE.LinearFilter : THREE.NearestFilter;
      t.minFilter = linear ? THREE.LinearFilter : THREE.NearestFilter;
      t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
      if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;
      return t;
    }
    function grain(g, x, y, w, h, amt, rng) {
      const d = g.getImageData(x, y, w, h), a = d.data;
      for (let i = 0; i < a.length; i += 4) {
        const v = (rng() - 0.5) * amt * 255;
        a[i] += v; a[i + 1] += v; a[i + 2] += v;
      }
      g.putImageData(d, x, y);
    }
    function rect(g, c, x, y, w, h) { g.fillStyle = c; g.fillRect(x, y, w, h); }
    const scratch = new Map();
    function hardText(g, text, x, y, color, align = "left", size = 8) {
      const w = g.canvas.width, h = g.canvas.height, key = w + "x" + h;
      if (!scratch.has(key)) scratch.set(key, cnv(w, h));
      const s = scratch.get(key), sg = ctx(s);
      sg.clearRect(0, 0, w, h);
      sg.font = size + 'px "PS2P"'; sg.fillStyle = color; sg.textAlign = align; sg.textBaseline = "top";
      sg.fillText(text, x, y);
      const d = sg.getImageData(0, 0, w, h), a = d.data;
      for (let i = 3; i < a.length; i += 4) a[i] = a[i] >= 110 ? 255 : 0;
      sg.putImageData(d, 0, 0);
      g.drawImage(s, 0, 0);
    }
    // tiny 3x5 digits for the phone status bar
    const DIG = { 0: "111101101101111", 1: "010110010010111", 2: "111001111100111", 3: "111001111001111", 4: "101101111001001", 5: "111100111001111", 6: "111100111101111", 7: "111001001001001", 8: "111101111101111", 9: "111101111001111", ":": "000010000010000" };
    function tinyText(g, s, x, y, c) {
      g.fillStyle = c;
      for (const ch of s) {
        const p = DIG[ch]; if (!p) { x += 2; continue; }
        for (let i = 0; i < 15; i++) if (p[i] === "1") g.fillRect(x + (i % 3), y + Math.floor(i / 3), 1, 1);
        x += ch === ":" ? 3 : 4;
      }
    }

    // =====================================================================
    // PS1 materials: vertex snapping + partly affine texture mapping
    // =====================================================================
    const SNAP = 82.0;
    function ps1(mat, aff = 0.5) {
      mat.onBeforeCompile = (s) => {
        s.vertexShader = "varying vec3 vAff;\n" + s.vertexShader.replace(
          "#include <project_vertex>",
          `#include <project_vertex>
           { vec4 sp = gl_Position; sp.xy = floor(sp.xy / sp.w * ${SNAP.toFixed(1)} + 0.5) / ${SNAP.toFixed(1)} * sp.w; gl_Position = sp; }
           #ifdef USE_MAP
             vAff = vec3(vMapUv * gl_Position.w, gl_Position.w);
           #else
             vAff = vec3(0.0, 0.0, 1.0);
           #endif`,
        );
        s.fragmentShader = "varying vec3 vAff;\n" + s.fragmentShader.replace(
          "#include <map_fragment>",
          `#ifdef USE_MAP
             vec2 affUv = mix(vMapUv, vAff.xy / vAff.z, ${aff.toFixed(2)});
             vec4 sampledDiffuseColor = texture2D(map, affUv);
             diffuseColor *= sampledDiffuseColor;
           #endif`,
        );
      };
      mat.customProgramCacheKey = () => "ps1-" + aff.toFixed(2);
      return mat;
    }
    const lam = (o, aff) => ps1(new THREE.MeshLambertMaterial(o), aff);
    const bas = (o, aff) => ps1(new THREE.MeshBasicMaterial(o), aff);

    // =====================================================================
    // renderer + post
    // =====================================================================
    const canvas = document.getElementById("w-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, W, false);
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.setClearColor(0x000000, 1);
    const rt = new THREE.WebGLRenderTarget(W, W, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, type: THREE.HalfFloatType });
    const rtPrev = new THREE.WebGLRenderTarget(W, W, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, type: THREE.HalfFloatType });

    const scene = new THREE.Scene();
    const FOG0 = new THREE.Color("#6a706c");
    scene.fog = new THREE.Fog(FOG0.clone(), 2.5, 21);
    const camera = new THREE.PerspectiveCamera(50, 1, 0.08, 60);

    const hemi = new THREE.HemisphereLight(0xb3bbbd, 0x2e2c27, 1.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xc8cdd2, 0.9);
    sun.position.set(-4, 10, 3); scene.add(sun);

    const post = new THREE.ShaderMaterial({
      uniforms: {
        tDiffuse: { value: rt.texture }, tPrev: { value: null }, uMix: { value: 1 }, res: { value: new THREE.Vector2(W, W) },
        uFade: { value: 1 }, uLid: { value: 0 }, uFrame: { value: 0 }, uGrain: { value: 0.035 }, uTear: { value: 0 }, uTearY: { value: 0.5 },
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse; uniform sampler2D tPrev; uniform float uMix; uniform vec2 res;
        uniform float uFade, uLid, uFrame, uGrain, uTear, uTearY;
        varying vec2 vUv;
        float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
        float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
        float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
        void main(){
          vec2 px = floor(vUv * res);
          vec2 uv = (px + 0.5) / res;
          float band = step(abs(uv.y - uTearY), 0.03) * uTear;
          uv.x += band * (hash(vec2(px.y, uFrame)) - 0.5) * 0.06;
          vec3 c;
          float ab = (0.45 + band * 2.0) / res.x;
          c.r = mix(texture2D(tPrev, uv + vec2(ab, 0.0)).r, texture2D(tDiffuse, uv + vec2(ab, 0.0)).r, uMix);
          c.g = mix(texture2D(tPrev, uv).g, texture2D(tDiffuse, uv).g, uMix);
          c.b = mix(texture2D(tPrev, uv - vec2(ab, 0.0)).b, texture2D(tDiffuse, uv - vec2(ab, 0.0)).b, uMix);
          c = pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));
          // sick, cold grade: desaturate, green-grey shadows, a touch of violet in the mids
          float l = dot(c, vec3(0.299, 0.587, 0.114));
          c = mix(vec3(l), c, 0.72);
          c *= mix(vec3(0.93, 1.0, 0.95), vec3(1.0, 0.97, 1.02), smoothstep(0.25, 0.7, l));
          c = clamp((c - 0.035) * 1.1, 0.0, 1.0);
          c = mix(c, c * c * (3.0 - 2.0 * c), 0.4);
          c *= uFade;
          // analog capture: faint grain + a soft line pattern
          c += (hash(px + uFrame * 7.13) - 0.5) * uGrain;
          c *= 0.975 + 0.025 * mod(px.y, 2.0);
          vec2 d = uv - 0.5;
          c *= 1.0 - dot(d, d) * 0.9;
          // heavy eyelids
          float x2 = pow((uv.x - 0.5) * 2.0, 2.0);
          float h = 0.9 * pow(max(1.0 - uLid, 0.0), 0.8);
          float edge = h * (1.0 - 0.3 * x2);
          float dy = abs(uv.y - 0.5);
          c *= 1.0 - smoothstep(edge - 0.12, edge, dy) * step(0.001, uLid);
          // ordered dither into 5-bit channels
          float b = bayer4(px) - 0.5;
          float L = 31.0;
          c = floor(c * L + 0.5 + b * 0.85) / L;
          gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
        }`,
      depthTest: false, depthWrite: false,
    });
    const postScene = new THREE.Scene();
    const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));

    // full-screen 2D "map screen" layer, rendered into the same low-res target
    const mapCanvas = cnv(W, W), mapG = ctx(mapCanvas), mapTex = tx(mapCanvas);
    const mapScene = new THREE.Scene();
    mapScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: mapTex, depthTest: false, depthWrite: false, toneMapped: false })));

    // =====================================================================
    // geometry helpers
    // =====================================================================
    function planarUV(geom, tile, off = [0, 0, 0]) {
      const p = geom.attributes.position, n = geom.attributes.normal, uv = geom.attributes.uv;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i) + off[0], y = p.getY(i) + off[1], z = p.getZ(i) + off[2];
        const nx = n.getX(i), ny = n.getY(i), nz = n.getZ(i);
        let u, v;
        if (Math.abs(ny) > 0.5) { u = x; v = -z; }
        else if (Math.abs(nx) > 0.5) { u = -z * Math.sign(nx); v = y; }
        else { u = x * Math.sign(nz); v = y; }
        uv.setXY(i, u / tile, v / tile);
      }
      uv.needsUpdate = true; return geom;
    }
    const segs = (s, step = 2) => Math.max(1, Math.ceil(s / step));
    function boxG(w, h, d, step = 2) { return new THREE.BoxGeometry(w, h, d, segs(w, step), segs(h, step), segs(d, step)); }
    function mesh(geom, mat, x = 0, y = 0, z = 0, parent = scene) {
      const m = new THREE.Mesh(geom, mat); m.position.set(x, y, z); parent.add(m); return m;
    }
    // tiled box: world-planar UVs
    function tbox(w, h, d, mat, x, y, z, tile, parent = scene) {
      const g = planarUV(boxG(w, h, d), tile, [x, y, z]);
      return mesh(g, mat, x, y, z, parent);
    }
    function prismG(w, d, h) {
      // ridge along x, gable ends on +-x
      const hw = w / 2, hd = d / 2;
      const P = [
        [-hw, 0, hd], [hw, 0, hd], [hw, h, 0], [-hw, h, 0], // front slope
        [hw, 0, -hd], [-hw, 0, -hd], [-hw, h, 0], [hw, h, 0], // back slope
      ];
      const pos = [], uv = [];
      const quad = (a, b, c, d2, uw, uh) => {
        pos.push(...a, ...b, ...c, ...a, ...c, ...d2);
        uv.push(0, 0, uw, 0, uw, uh, 0, 0, uw, uh, 0, uh);
      };
      const sl = Math.hypot(hd, h);
      quad(P[0], P[1], P[2], P[3], w / 2, sl / 2);
      quad(P[4], P[5], P[6], P[7], w / 2, sl / 2);
      // gables
      pos.push(hw, 0, hd, hw, 0, -hd, hw, h, 0, -hw, 0, -hd, -hw, 0, hd, -hw, h, 0);
      uv.push(0, 0, d / 2, 0, d / 4, h / 2, 0, 0, d / 2, 0, d / 4, h / 2);
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
      g.computeVertexNormals();
      return g;
    }

    // =====================================================================
    // textures
    // =====================================================================
    const TX = {};
    function makeTiles() {
      // asphalt road: 7 m across, 6 m along (u across, v along)
      {
        const rng = mulberry32(3), c = cnv(56, 48), g = ctx(c);
        rect(g, "#3c3d3b", 0, 0, 56, 48);
        for (let i = 0; i < 9; i++) rect(g, rng() < 0.5 ? "#353634" : "#444542", Math.floor(rng() * 50), Math.floor(rng() * 44), 3 + Math.floor(rng() * 10), 2 + Math.floor(rng() * 7));
        grain(g, 0, 0, 56, 48, 0.12, rng);
        for (let k = 0; k < 5; k++) { // cracks
          let x = Math.floor(rng() * 56), y = Math.floor(rng() * 48);
          for (let s = 0; s < 14; s++) { rect(g, "#1f201f", x, y, 1, 1); x = (x + (rng() < 0.5 ? 1 : 0) + 56) % 56; y = (y + (rng() < 0.6 ? 1 : -1) + 48) % 48; }
        }
        for (let y = 0; y < 24; y++) if (rng() > 0.25) rect(g, "#8f8c7e", 27, y, 2, 1); // worn centre dash
        rect(g, "#2c2d2b", 0, 0, 2, 48); rect(g, "#2c2d2b", 54, 0, 2, 48);
        TX.road = tx(c, true);
      }
      // plain asphalt for the intersection
      {
        const rng = mulberry32(4), c = cnv(32, 32), g = ctx(c);
        rect(g, "#3d3e3c", 0, 0, 32, 32); grain(g, 0, 0, 32, 32, 0.13, rng);
        for (let i = 0; i < 4; i++) rect(g, "#333432", Math.floor(rng() * 28), Math.floor(rng() * 28), 4, 3);
        TX.asph = tx(c, true);
      }
      // sidewalk slabs: 1.5 m tile
      {
        const rng = mulberry32(5), c = cnv(24, 24), g = ctx(c);
        rect(g, "#6e6d66", 0, 0, 24, 24);
        rect(g, "#64635c", 12, 0, 12, 12); rect(g, "#6a6962", 0, 12, 12, 12);
        grain(g, 0, 0, 24, 24, 0.12, rng);
        rect(g, "#45443f", 0, 0, 24, 1); rect(g, "#45443f", 0, 0, 1, 24); rect(g, "#4d4c46", 12, 0, 1, 24); rect(g, "#4d4c46", 0, 12, 24, 1);
        for (let i = 0; i < 6; i++) rect(g, "#4b5a3e", Math.floor(rng() * 24), rng() < 0.5 ? 0 : 12, 1, 1); // weeds in joints
        rect(g, "#55544d", 16, 5, 3, 1); rect(g, "#55544d", 18, 6, 1, 2);
        TX.walk = tx(c, true);
      }
      // concrete (curbs, barriers, posts): 1 m tile
      {
        const rng = mulberry32(6), c = cnv(16, 16), g = ctx(c);
        rect(g, "#77756d", 0, 0, 16, 16); grain(g, 0, 0, 16, 16, 0.16, rng);
        rect(g, "#5e5c55", 0, 15, 16, 1);
        TX.conc = tx(c, true);
      }
      // dirt / dead grass lots: 2 m tile
      {
        const rng = mulberry32(7), c = cnv(32, 32), g = ctx(c);
        rect(g, "#4a4a3c", 0, 0, 32, 32);
        for (let i = 0; i < 160; i++) rect(g, ["#3f4134", "#55533f", "#3a3d30", "#5b574a"][Math.floor(rng() * 4)], Math.floor(rng() * 32), Math.floor(rng() * 32), 1 + Math.floor(rng() * 2), 1);
        TX.dirt = tx(c, true);
      }
      // roof tar: 2 m tile
      {
        const rng = mulberry32(8), c = cnv(16, 16), g = ctx(c);
        rect(g, "#2f302d", 0, 0, 16, 16); grain(g, 0, 0, 16, 16, 0.14, rng);
        TX.roof = tx(c, true);
      }
      // shingles for pitched roofs
      {
        const rng = mulberry32(9), c = cnv(16, 16), g = ctx(c);
        rect(g, "#3b302c", 0, 0, 16, 16);
        for (let y = 0; y < 16; y += 4) { rect(g, "#2a221f", 0, y, 16, 1); for (let x = (y / 4) % 2 ? 2 : 0; x < 16; x += 4) rect(g, "#2a221f", x, y, 1, 4); }
        grain(g, 0, 0, 16, 16, 0.14, rng);
        TX.shingle = tx(c, true);
      }
      // rusty metal
      {
        const rng = mulberry32(10), c = cnv(16, 16), g = ctx(c);
        rect(g, "#4b4a45", 0, 0, 16, 16);
        for (let i = 0; i < 30; i++) rect(g, rng() < 0.5 ? "#5a3f2c" : "#3a3936", Math.floor(rng() * 16), Math.floor(rng() * 16), 1 + Math.floor(rng() * 2), 1 + Math.floor(rng() * 2));
        grain(g, 0, 0, 16, 16, 0.1, rng);
        TX.metal = tx(c, true);
      }
      // weathered wood
      {
        const rng = mulberry32(12), c = cnv(16, 16), g = ctx(c);
        rect(g, "#4e4235", 0, 0, 16, 16);
        for (let y = 0; y < 16; y += 4) rect(g, "#3a3027", 0, y, 16, 1);
        grain(g, 0, 0, 16, 16, 0.14, rng);
        TX.wood = tx(c, true);
      }
      // chain-link fence (alpha)
      {
        const c = cnv(16, 16), g = ctx(c);
        g.clearRect(0, 0, 16, 16);
        for (let i = 0; i < 16; i++) { rect(g, "#8a8b86", i, i, 1, 1); rect(g, "#8a8b86", 15 - i, i, 1, 1); }
        TX.fence = tx(c, true);
      }
      // soft blob shadow
      {
        const c = cnv(32, 32), g = ctx(c);
        const gr = g.createRadialGradient(16, 16, 2, 16, 16, 16);
        gr.addColorStop(0, "rgba(0,0,0,0.75)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
        TX.blob = tx(c, false, true);
      }
      // lamp halo
      {
        const c = cnv(32, 32), g = ctx(c);
        const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
        gr.addColorStop(0, "rgba(255,220,170,1)"); gr.addColorStop(0.25, "rgba(255,200,140,0.45)"); gr.addColorStop(1, "rgba(255,190,120,0)");
        g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
        TX.halo = tx(c, false, true);
      }
      // light cone gradient
      {
        const c = cnv(4, 32), g = ctx(c);
        const gr = g.createLinearGradient(0, 0, 0, 32);
        gr.addColorStop(0, "rgba(255,210,160,0.0)"); gr.addColorStop(0.15, "rgba(255,210,160,1)"); gr.addColorStop(1, "rgba(255,210,160,0.05)");
        g.fillStyle = gr; g.fillRect(0, 0, 4, 32);
        TX.cone = tx(c, false, true);
      }
      // fog puff
      {

    function polesAndWires() {
      const wm = lam({ map: TX.wood }, 0);

      const runs = [
        [[-6.0, 22], [-6.0, 9], [-6.0, -4], [-6.0, -23.2], [-6.0, -36], [-6.0, -49]],
        [[-14, -22.9], [-27, -22.9], [-40, -22.9]],
        [[9.5, -9.7], [20.5, -9.7]],

      for (const run of runs) {
        const tops = [];
        for (const [x, z] of run) {
          mesh(new THREE.CylinderGeometry(0.1, 0.13, 7.6, 5), wm, x, 3.8, z);
          const alongX = run === runs[1] || run === runs[2];
          const cb = mesh(new THREE.BoxGeometry(alongX ? 0.1 : 1.6, 0.1, alongX ? 1.6 : 0.1), wm, x, 7.1, z);

        const pts = [];
        for (let i = 0; i < tops.length - 1; i++) {

          for (const off of [-0.7, 0, 0.7]) {

        const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
        scene.add(new THREE.LineSegments(g, lineM));

    function tree(x, z, seed, s = 1) {
      const rng = mulberry32(seed), m = lam({ color: 0x2b2620, flatShading: true }, 0);
      function branch(p, dir, len, r, depth) {
        const end = p.clone().addScaledVector(dir, len);
        const g = new THREE.CylinderGeometry(r * 0.6, r, len, 4); g.translate(0, len / 2, 0);
        const b = new THREE.Mesh(g, m); b.position.copy(p);
        b.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); scene.add(b);
        if (depth > 0) for (let i = 0; i < (depth > 1 ? 3 : 2); i++) {
          const nd = dir.clone().add(new THREE.Vector3((rng() - 0.5) * 1.6, 0.35 + rng() * 0.4, (rng() - 0.5) * 1.6)).normalize();
          branch(end, nd, len * (0.55 + rng() * 0.2), r * 0.6, depth - 1);
        }
      }
      branch(new THREE.Vector3(x, 0, z), new THREE.Vector3(0, 1, 0), 2.6 * s, 0.16 * s, 3);
    }

    function fence(x0, z0, x1, z1, h = 2.0) {

      const g = mapG;
      rect(g, "#050606", 0, 0, W, W);
      g.drawImage(stage === 2 ? S.mapBase2 : S.mapBase1, MAP.ox, MAP.oy);
      const X = (x) => MAP.ox + x, Y = (y) => MAP.oy + y;

        for (let i = 0; i < LOOP.length - 1; i++) { const l = Math.hypot(LOOP[i + 1][0] - LOOP[i][0], LOOP[i + 1][1] - LOOP[i][1]); segsL.push(l); total += l; }
