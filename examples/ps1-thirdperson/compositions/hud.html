  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="hud"]');

      // each word is typed at its sung time; letters spread over a short span, never into the next word
      root.querySelectorAll(".box").forEach((box) => {
        const words = [];
        box.querySelectorAll(".ln").forEach((ln) => {
          ln.textContent = "";
          ln.dataset.words.split(" ").forEach((tok, i) => {
            const at = tok.lastIndexOf("@");
            const w = tok.slice(0, at), s = parseFloat(tok.slice(at + 1));
            if (i) ln.appendChild(document.createTextNode(" "));
            const spans = [...w].map((c) => {
              const sp = document.createElement("span");
              sp.className = "ch"; sp.textContent = c; ln.appendChild(sp); return sp;
            });
            words.push({ s, spans });
          });
        });
        const t0 = words[0].s, hide = parseFloat(box.dataset.hide);
        tl.fromTo(box, { opacity: 0, scaleY: 0.5 }, { opacity: 1, scaleY: 1, duration: 0.07, ease: "steps(2)" }, t0 - 0.02);
        words.forEach((w, i) => {
          const next = i < words.length - 1 ? words[i + 1].s : w.s + 0.5;
          const span = Math.min(0.055 * w.spans.length, Math.max(0.03, next - w.s - 0.02));
          w.spans.forEach((sp, k) => tl.set(sp, { opacity: 1 }, w.s + (span * k) / w.spans.length));
        });
        tl.to(box, { opacity: 0, duration: 0.06, ease: "steps(2)" }, hide - 0.06);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["hud"] = tl;
    })();
  </script>
