  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="hud"]');

      // typewriter: split each line into per-character spans, each word typed from its sung time
      function typeLines(boxSel, endTime) {
        const lines = root.querySelectorAll(boxSel + " .ln");
        const words = [];
        lines.forEach((ln) => {
          ln.textContent = "";
          ln.dataset.words.split(" ").forEach((tok, i) => {
            const [w, s] = tok.split("@");
            if (i) ln.appendChild(document.createTextNode(" "));
            const spans = [...w].map((c) => { const sp = document.createElement("span"); sp.className = "ch"; sp.textContent = c; ln.appendChild(sp); return sp; });
            words.push({ s: parseFloat(s), spans });
          });
        });
        words.forEach((w, i) => {
          const next = i < words.length - 1 ? words[i + 1].s : w.s + 0.4;
          const span = Math.min(0.06 * w.spans.length, Math.max(0.03, next - w.s - 0.02));
          w.spans.forEach((sp, k) => tl.set(sp, { opacity: 1 }, w.s + (span * k) / w.spans.length));
        });
        return words;
      }

      // HUD clock
      tl.set("#clk-57", { opacity: 1 }, 0);
      tl.set("#clk-57", { opacity: 0 }, 5.32);
      tl.set("#clk-58", { opacity: 1 }, 5.32);
      tl.set("#clk-58", { opacity: 0 }, 9.22);
      tl.set("#clk-59", { opacity: 1 }, 9.22);

      // L2 dialogue
      tl.fromTo("#dlg-help .dlg", { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.12, ease: "steps(3)" }, 2.2);
      typeLines("#dlg-help");
      tl.fromTo("#dlg-help-more", { opacity: 0 }, { opacity: 1, duration: 0.01, repeat: 2, yoyo: true, repeatDelay: 0.2 }, 4.75);
      tl.to("#dlg-help .dlg", { opacity: 0, duration: 0.1, ease: "steps(2)" }, 5.18);

      // L4 error windows: the body grows with the words, then copies pile up

        tl.fromTo(id, { opacity: 1, x: -10 }, { opacity: 1, x: 0, duration: 0.07, ease: "steps(2)" }, t);
      });

      // L9 status message, flickering with the eyelids
      tl.set("#st-1", { opacity: 1 }, 19.14);
      tl.set("#st-2", { opacity: 1 }, 19.6);
      tl.fromTo("#status-msg", { opacity: 1 }, { opacity: 0.45, duration: 0.28, ease: "sine.inOut", yoyo: true, repeat: 1 }, 19.5);
      tl.to("#status-msg", { opacity: 0, duration: 0.2 }, 20.38);

      // L9 area title
      tl.set("#ar-1", { opacity: 1 }, 20.46);
      tl.set("#ar-2", { opacity: 1 }, 20.6);
      tl.set("#ar-3", { opacity: 1 }, 20.96);
      tl.fromTo(["#area-rule-1", "#area-rule-2"], { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 21.6);
      tl.fromTo("#ar-4", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "steps(5)" }, 21.74);
      tl.fromTo("#ar-5", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "steps(5)" }, 22.3);

      // L10 dialogue, eyes barely open
