  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="hud"]');

      // every word appears at its sung time; letters spread over a short span, never into the next word
      root.querySelectorAll(".dlg").forEach((box) => {
        const words = [];
        box.querySelectorAll(".ln").forEach((ln) => {
          ln.textContent = "";
          ln.dataset.words.split(" ").forEach((tok, i) => {
            const at = tok.lastIndexOf("@");
            const w = tok.slice(0, at), s = parseFloat(tok.slice(at + 1));
            if (i) ln.appendChild(document.createTextNode(" "));
            const spans = [...w].map((c) => {
              const sp = document.createElement("span");
              sp.className = "ch"; sp.textContent = c; ln.appendChild(sp); return sp;
            });
            words.push({ s, spans });
          });
        });
        const t0 = words[0].s, hide = parseFloat(box.dataset.hide);
        tl.set(box, { opacity: 1 }, t0 - 0.02);
        words.forEach((w, i) => {
          const next = i < words.length - 1 ? words[i + 1].s : w.s + 0.5;
          const span = Math.min(0.055 * w.spans.length, Math.max(0.03, next - w.s - 0.02));
          w.spans.forEach((sp, k) => tl.set(sp, { opacity: 1 }, w.s + (span * k) / w.spans.length));
        });
        tl.set(box, { opacity: 0 }, hide);
      });
      root.querySelectorAll(".band, .prompt").forEach((el) => {
        const a = parseFloat(el.dataset.show), b = parseFloat(el.dataset.hide);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: el.classList.contains("band") ? 0.25 : 0.05, ease: "steps(3)" }, a);
        tl.set(el, { opacity: 0 }, b);
      });
      // the band dips out where the screen itself carries the line (phone close-up) and comes back
      const band = root.querySelector(".band");
      tl.to(band, { opacity: 0, duration: 0.2 }, 17.3);
      tl.to(band, { opacity: 1, duration: 0.2 }, 19.0);
      tl.to(band, { opacity: 0, duration: 0.2 }, 5.3);
      tl.to(band, { opacity: 1, duration: 0.1 }, 6.98);

      window.__timelines = window.__timelines || {};
      window.__timelines["hud"] = tl;
    })();
  </script>
