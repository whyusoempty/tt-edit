  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.181.2/+esm";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/loaders/GLTFLoader.js/+esm";

    // =====================================================================
    // timing (transcript/TRANSCRIPT.md + lyrics-timing.json)
    // =====================================================================
    const DUR = 26.68, FPS = 30, W = 500;
    const T = {
      A2: 1.85, B1: 3.0, B2: 4.45, C1: 5.32, GAP0: 6.52, C2: 7.04, WHIP: 8.6, WHIP2: 8.98, D1: 9.22, LOOP: 11.64, SNAP: 12.0, BLK: 12.12,
      E1: 12.28, PYAT: 13.2, OFF: 14.08, ON: 14.38, F1: 15.44, TYPE: 17.3, G1: 19.14, H1: 22.74, VOT: 24.38, EYES: 25.38, RED: 25.44, END: 26.09,
    };
    const TRANS = [[T.B1, 0.35, "mix"], [T.F1, 0.3, "mix"], [T.H1, 0.4, "mix"]];

    // =====================================================================
    // helpers
    // =====================================================================
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const lerp = (a, b, u) => a + (b - a) * u;
    const smooth = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
    const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
    const frameOf = (t) => Math.floor(t * FPS + 1e-4);
    function hash1(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
    function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
    const DEG = Math.PI / 180;
    // Blender (x, y, z-up) → three (x, z, -y)
    const B = (x, y, z) => new THREE.Vector3(x, z, -y);
    function env(keys, t) {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) { const [t0, v0] = keys[i], [t1, v1] = keys[i + 1]; if (t < t1) return lerp(v0, v1, smooth((t - t0) / (t1 - t0))); }
      return keys[keys.length - 1][1];
    }
    function cr(p0, p1, p2, p3, u) { const u2 = u * u, u3 = u2 * u; return 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3); }
    // keys: [t, x, y, z, yaw, pitch]  (Blender coords; yaw 0 = +Y north, 90 = +X east; pitch + = up)
    function path(keys, t, easeEnds = true) {
      const n = keys.length;
      if (t <= keys[0][0]) return keys[0].slice(1);
      if (t >= keys[n - 1][0]) return keys[n - 1].slice(1);
      let i = 0; while (i < n - 2 && t >= keys[i + 1][0]) i++;
      let u = (t - keys[i][0]) / (keys[i + 1][0] - keys[i][0]);
      if (easeEnds) {
        if (n === 2) u = smooth(u);
        else if (i === 0) u = 0.5 * u + 0.5 * (1 - Math.cos(u * Math.PI / 2));
        else if (i === n - 2) u = 0.5 * u + 0.5 * Math.sin(u * Math.PI / 2);
      }
      const k0 = keys[Math.max(0, i - 1)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(n - 1, i + 2)];
      const out = [];
      for (let c = 1; c < 6; c++) out.push(cr(k0[c], k1[c], k2[c], k3[c], u));
      return out;
    }

    // ---------------- bitmap font from Press Start 2P (crisp, thresholded, cached per colour)
    const GLY = new Map();
    function glyph(ch, size, color) {
      const key = ch + "|" + size + "|" + color;
      if (GLY.has(key)) return GLY.get(key);
      const c = document.createElement("canvas"); c.width = size; c.height = size;
      const g = c.getContext("2d");
      g.font = size + 'px "PS2P"'; g.textBaseline = "top"; g.fillStyle = "#fff"; g.fillText(ch, 0, 0);
      const d = g.getImageData(0, 0, size, size), a = d.data;
      for (let i = 3; i < a.length; i += 4) a[i] = a[i] >= 110 ? 255 : 0;
      g.putImageData(d, 0, 0);
      g.globalCompositeOperation = "source-in"; g.fillStyle = color; g.fillRect(0, 0, size, size);
      GLY.set(key, c); return c;
    }
    function txt(g, s, x, y, color, size = 8, align = "left", shadow = null) {
      s = String(s);
      const w = s.length * size;
      if (align === "center") x -= Math.floor(w / 2); else if (align === "right") x -= w;
      x = Math.round(x); y = Math.round(y);
      for (let i = 0; i < s.length; i++) {
        const ch = s[i]; if (ch === " ") continue;
        if (shadow) g.drawImage(glyph(ch, size, shadow), x + i * size + Math.max(1, size / 8), y + Math.max(1, size / 8));
        g.drawImage(glyph(ch, size, color), x + i * size, y);
      }
      return w;
    }
    // words sung by time: "слово@время" → visible prefix of a line at time t (letters spread over the word)
    function sung(spec, t) {
      let out = "";
      const toks = spec.split(" ").map((tok) => { const at = tok.lastIndexOf("@"); return [tok.slice(0, at), parseFloat(tok.slice(at + 1))]; });
      for (let i = 0; i < toks.length; i++) {
        const [w, s] = toks[i];
        if (t < s) break;
        const next = i < toks.length - 1 ? toks[i + 1][1] : s + 0.5;
        const span = Math.min(0.055 * w.length, Math.max(0.03, next - s - 0.02));
        const n = Math.min(w.length, Math.floor(((t - s) / span) * w.length) + 1);
        out += (i ? " " : "") + w.slice(0, n);
      }
      return out;
    }
    function cnv(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.imageSmoothingEnabled = false; return [c, g]; }

    // =====================================================================
    // PS1 materials: vertex snap + partially affine UVs (+ optional wall warp for the loop beat)
    // =====================================================================
    const SNAP = 170.0;
    const WARP = { value: 0 }, WTIME = { value: 0 };
    function ps1(mat, aff = 0.3, warp = false) {
      mat.onBeforeCompile = (s) => {
        s.uniforms.uWarp = WARP; s.uniforms.uWTime = WTIME;
        s.vertexShader = "uniform float uWarp; uniform float uWTime; varying vec3 vAff;\n" + s.vertexShader.replace(
          "#include <begin_vertex>",
          `#include <begin_vertex>
           ${warp ? `{ vec4 wp = modelMatrix * vec4(transformed, 1.0);
             float r = length(wp.xz);
             vec3 off = vec3(sin(wp.y * 2.3 + uWTime * 3.1) * 0.35, sin(r * 1.7 - uWTime * 2.0) * 0.45, cos(wp.y * 1.9 + uWTime * 2.6) * 0.35) * uWarp;
             transformed += (inverse(mat3(modelMatrix)) * off); }` : ""}`,
        ).replace(
          "#include <project_vertex>",
          `#include <project_vertex>
           { vec4 sp = gl_Position; sp.xy = floor(sp.xy / sp.w * ${SNAP.toFixed(1)} + 0.5) / ${SNAP.toFixed(1)} * sp.w; gl_Position = sp; }
           #ifdef USE_MAP
             vAff = vec3(vMapUv * gl_Position.w, gl_Position.w);
           #else
             vAff = vec3(0.0, 0.0, 1.0);
           #endif`);
        s.fragmentShader = "varying vec3 vAff;\n" + s.fragmentShader.replace(
          "#include <map_fragment>",
          `#ifdef USE_MAP

             vec4 sampledDiffuseColor = texture2D(map, affUv);
             diffuseColor *= sampledDiffuseColor;
           #endif`);

    }

    // =====================================================================
    // renderer + targets
    // =====================================================================
    const canvas = document.getElementById("w-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, W, false);
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    const RT = (w, h = w, nearest = false) => new THREE.WebGLRenderTarget(w, h, { minFilter: nearest ? THREE.NearestFilter : THREE.LinearFilter, magFilter: nearest ? THREE.NearestFilter : THREE.LinearFilter, type: THREE.HalfFloatType });
    const rt = RT(W, W, true), rtPrev = RT(W, W, true), rtB1 = RT(125), rtB2 = RT(125);
    // small LDR target for CCTV feeds / phone photos (read back into canvases)
    const rtCam = new THREE.WebGLRenderTarget(128, 96, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, type: THREE.UnsignedByteType });
    const camBuf = new Uint8Array(128 * 96 * 4);
    const FW = 128, FH = 96;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 4, 16);
    const camera = new THREE.PerspectiveCamera(64, 1, 0.03, 40);

    // =====================================================================
    // GLB → PS1 materials, lights, screens
    // =====================================================================
    const loader = new GLTFLoader();
    function aoRemap(geom, strength) {
      const a = geom.attributes.color;
      const out = new Float32Array(a.count * 3);
      for (let i = 0; i < a.count; i++) { const v = lerp(1, Math.pow(a.getX(i), 0.62), strength); out[i * 3] = out[i * 3 + 1] = out[i * 3 + 2] = v; }

    }
    function nearestTex(t) { t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace; t.flipY = false; t.needsUpdate = true; return t; }
    const SCR = {};
    function screenFor(name, w, h) {
      if (SCR[name]) return SCR[name];
      const [c, g] = cnv(w, h);
      const tex = nearestTex(new THREE.CanvasTexture(c));
      return (SCR[name] = { c, g, tex, w, h, meshes: [] });
    }
    const SCREEN_SIZES = {
      diag: [160, 120], main: [176, 116], sec: [128, 96], keypad: [96, 64], vitals: [144, 100], secmed: [128, 96], cap_ctl: [96, 56],
      clock: [192, 72], ring: [128, 88], phone: [112, 240], phone_lk: [32, 64], stars: [48, 48], atlas: [1024, 384],
    };
    function convert(root, opts = {}) {
      const room = { root, L: {}, emit: [], mats: [], dyn: {} };
      root.traverse((o) => {
        if (o.name.startsWith("L_") && o.userData.color) {
          const [r, g, b] = o.userData.color;
          const L = new THREE.PointLight(new THREE.Color(r, g, b), o.userData.power * 11, o.userData.dist * 1.3, 1.3);

          o.add(L); room.L[o.name.slice(2)] = L;
        }
        if (o.name.startsWith("DYN_") || o.name.startsWith("FLESH_") || o.name.startsWith("FACE_") || o.name.startsWith("CAM_") || o.name.startsWith("FIG_")) room.dyn[o.name] = o;

          const key = o.name.startsWith("SCRA_") ? "atlas" : o.name.slice(4);
          const sz = SCREEN_SIZES[key] || [64, 48];
          const s = screenFor(opts.prefix && key === "atlas" ? opts.prefix + "atlas" : key, sz[0], sz[1]);

        } else if (name.startsWith("EMIT_")) {
          const base = src.emissive.clone();

          o.material.userData.base = base;
          room.emit.push(o);
        } else if (name === "glass") {
          o.material = new THREE.MeshBasicMaterial({ map, transparent: true, opacity: 0.6, depthWrite: false, color: 0x9ab0ac, side: THREE.DoubleSide });
        } else {
          const isDec = name.startsWith("sg_") || name.startsWith("poster") || name === "gauge" || o.name.startsWith("DEC_");

          if (isDec) { o.material.polygonOffset = true; o.material.polygonOffsetFactor = -2; }

    // =====================================================================
    // post: bloom + per-scene monochrome ramp + dither + analog capture
    // =====================================================================
    const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    const postScene = new THREE.Scene(); postScene.add(quad);
    const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
    const brightM = new THREE.ShaderMaterial({ uniforms: { t: { value: null }, thr: { value: 0.5 } }, vertexShader: VS, depthTest: false,
      fragmentShader: `uniform sampler2D t; uniform float thr; varying vec2 vUv;
        void main(){ vec3 c = vec3(0.0); for(int i=0;i<4;i++) for(int j=0;j<4;j++) c += texture2D(t, vUv + (vec2(i,j)-1.5)/500.0).rgb; c/=16.0;
        float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(thr, thr + 0.45, l), 1.0); }` });
    const blurM = new THREE.ShaderMaterial({ uniforms: { t: { value: null }, dir: { value: new THREE.Vector2(1, 0) } }, vertexShader: VS, depthTest: false,
      fragmentShader: `uniform sampler2D t; uniform vec2 dir; varying vec2 vUv;
        void main(){ vec3 c = texture2D(t, vUv).rgb * 0.2270;
          c += (texture2D(t, vUv + dir*1.3846/125.0).rgb + texture2D(t, vUv - dir*1.3846/125.0).rgb) * 0.3162;
          c += (texture2D(t, vUv + dir*3.2308/125.0).rgb + texture2D(t, vUv - dir*3.2308/125.0).rgb) * 0.0703;
          gl_FragColor = vec4(c, 1.0); }` });
    const post = new THREE.ShaderMaterial({
      uniforms: {
        tScene: { value: rt.texture }, tPrev: { value: rtPrev.texture }, uMix: { value: 1 }, tBloom: { value: rtB1.texture }, res: { value: new THREE.Vector2(W, W) },
        uBloom: { value: 0.9 }, uMono: { value: 0.7 }, c1: { value: new THREE.Color() }, c2: { value: new THREE.Color() }, c3: { value: new THREE.Color() },
        uExpo: { value: 1.0 }, uFade: { value: 1 }, uLid: { value: 0 }, uFrame: { value: 0 }, uGrain: { value: 0.035 }, uAb: { value: 0.7 }, uTear: { value: 0 }, uTearY: { value: 0.5 },
      },
      vertexShader: VS, depthTest: false, depthWrite: false,
      fragmentShader: `
        uniform sampler2D tScene, tPrev, tBloom; uniform vec2 res; uniform float uMix, uBloom, uMono, uExpo, uFade, uLid, uFrame, uGrain, uAb, uTear, uTearY;

        varying vec2 vUv;
        float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

        float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }

        void main(){

          vec2 d = uv - 0.5;

          float l = clamp(dot(c, vec3(0.3, 0.55, 0.15)), 0.0, 1.0);
          c = mix(c, rampc(l), uMono);
          c = mix(c, c * c * (3.0 - 2.0 * c), 0.3);
          c *= 1.0 - dot(d, d) * 1.2;
          c *= uFade;
          if (uLid > 0.001) {
            float lid = (0.5 - 0.5 * uLid) * (1.0 - 0.3 * pow(abs(d.x) * 2.0, 2.0));
            c *= 1.0 - smoothstep(lid - 0.05, lid, abs(d.y));

          c *= 0.97 + 0.03 * mod(px.y, 2.0);
          float b = bayer4(px) - 0.5;
          c = floor(c * 24.0 + 0.5 + b * 0.95) / 24.0;
          gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
        }`,
    });
    function pass(material, target) { quad.material = material; renderer.setRenderTarget(target); renderer.render(postScene, postCam); }

    // =====================================================================
    // build
    // =====================================================================
    let built = false, pending = null;
    const R = {};
    const S = {};
    async function build() {
      await document.fonts.load('8px "PS2P"', "ДИАГНОСТИКА СОН ЧСС ЭЭГ ЗАПРЕЩЁН");
      await document.fonts.load('16px "PS2P"', "СТОЛЬКО ПРОБЛЕМ");
      const names = ["med", "corr", "ctrl", "ring", "quarters", "crew"];
      const gl = await Promise.all(names.map((n) => loader.loadAsync("assets/models/" + n + ".glb")));
      names.forEach((n, i) => {
        if (n === "crew") return;
        R[n] = convert(gl[i].scene, { warp: n === "ring", ao: n === "ctrl" ? 0.9 : 0.85 });
        R[n].root.visible = false; scene.add(R[n].root);
      });
      // ---- crew: split the glb into figure / patient / hand groups
      const crew = convert(gl[5].scene, { ao: 0.6 });
      const mk = (prefix, faceName, off) => {
        const g = new THREE.Group();
        const parts = [];
        crew.root.traverse((o) => { if (o.isMesh && (o.name.startsWith(prefix) || o.name === faceName || (prefix === "HAND_" && o.name === "SCR_phone"))) parts.push(o); });
        parts.forEach((o) => { o.position.add(off); g.add(o); });
        return g;
      };
      const faceMats = {};
      const texLoad = (name) => { const c = crew.root.getObjectByName("FACE_stand"); return c.material.map; };
      S.figTemplate = mk("STAND_", "FACE_stand", new THREE.Vector3(0, 0, 0));
      S.patient = mk("LIE_", "FACE_lie", B(-5.74, 1.7, 0.52));
      S.hand = mk("HAND_", "-", B(-10, 0, -0.05));
      S.faceLie = S.patient.getObjectByName("FACE_lie");
      // eyes-open texture: same atlas slot, swapped canvas
      S.faceClosedTex = S.faceLie.material.map;
      S.faceOpenTex = null;
      const fig = (layer) => { const g = S.figTemplate.clone(true); g.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); o.layers.set(layer); } }); g.layers.set(layer); return g; };
      S.fig = fig(0); S.figSec = fig(1); S.hero = fig(1);
      // the stranger is the same man, only darker — a shape more than a person
      S.fig.traverse((o) => { if (o.isMesh) o.material.color.multiplyScalar(0.4); });
      S.figSec.traverse((o) => { if (o.isMesh) o.material.color.multiplyScalar(0.75); });
      [S.fig, S.figSec, S.hero].forEach((g) => { g.visible = false; scene.add(g); });
      S.patient.traverse((o) => { if (o.isMesh) { o.material.color.multiplyScalar(0.72); o.material.userData.base = o.material.color.clone(); } });
      S.patient.visible = false; scene.add(S.patient);
      S.hand.visible = false; camera.add(S.hand);
      // the hand sits centimetres from the lens and every room light hits it: keep it a dim, dirty silhouette
      S.hand.traverse((o) => { if (o.isMesh && !o.name.startsWith("SCR")) { o.material.color.multiplyScalar(o.name.includes("skin") ? 0.38 : 0.6); o.material.userData.base = o.material.color.clone(); } });

        S.ind.forEach((o, i) => { const lit = t >= T.PYAT - 0.6 + (i % 6) * 0.1 || (Math.floor(t * 3 + i) % 2 === 0); o.material.color.copy(o.material.userData.base).multiplyScalar(out ? 0 : lit ? 1.2 : 0.15); });
        lights(R.quarters, out ? {} : after ? { pend: [1.6, "#ff3a20"], clock: 1.5, phone: 2.2 + 0.4 * Math.sin(t * 6), fill: 1.1 } : { pend: 1.3, clock: t >= T.PYAT ? 1.5 : 0.8, q1: 1.0, fill: 1.2 });
        expo = 1.3;
        emitScale(R.quarters, (n) => (out ? 0 : n === "EMIT_tube" && after ? 0.05 : 1));
        if (out) fade = 0;
        setGrade("warm", "red", after ? 0.45 : smooth(ramp(t, T.PYAT, T.PYAT + 0.5)) * 0.35);
        if (t >= T.PYAT && t < T.PYAT + 0.12) tear = 1;
      } else if (id === "F") {
        show("quarters");
        p = path(CAM.F, t);
        const b = bob(t, 0.15); p[0] += b[0]; p[2] += b[1];
        if (S.lk) S.lk.rotation.y = S.lk.userData.ry0 - 1.6;
        S.chairA.position.copy(B(1.4, -1.2, 0)); S.chairA.rotation.set(0, 2.6, 0);
        R.quarters.dyn.DYN_phone_lk.visible = false;
        S.hand.visible = true;
        const lift = smooth(ramp(t, T.F1, T.F1 + 0.45));
        const sw = Math.sin(t * 1.3) * 0.004;
        S.hand.position.set(0.0 + sw, lerp(-0.3, 0.012, lift), -0.2);
        S.hand.rotation.set(lerp(-0.9, 0.05, lift), 0.06, 0.03);
        // the live post shows this room from the ceiling corner: him, holding the phone
        if (t > 18.25) liveFeed(t);
        drawPhone(t);
        lights(R.quarters, { pend: [1.2, "#ff3a20"], clock: 1.0, phone: 0, fill: 0.8 });
        S.handLight.intensity = 0.0;
        expo = 1.25;
        setGrade("phone", "warm", 0.25);
        camera.near = 0.02;
        if (t > 18.95) tear = 1;
      } else if (id === "G" || id === "H") {
        show("med");
        const H = id === "H";
        p = H ? path(CAM.H, t) : path(CAM.G, t);
        const b = bob(t, H ? 0.25 : 0.55, 0.8); p[0] += b[0]; p[2] += b[1];
        S.patient.visible = true;
        const red = t >= T.RED;
        S.faceLie.material.map = t >= T.EYES ? S.faceOpenTex : S.faceClosedTex;
        lights(R.med, red ? { red1: 1.6, red2: 1.6, red3: 1.6, cap_in: [0.6, "#ff2010"] } : { m1: 0.9, m2: 0.9, m3: 1.0, cap_in: 1.0, fill: 0.8, term: 0.3 });
        emitScale(R.med, (n) => (red ? (n === "EMIT_red" ? 1.4 : n === "EMIT_tube" ? 0.05 : 0.6) : n === "EMIT_red" ? 0.15 : 1));
        drawDiag(t); drawAtlas(t, "med"); drawVitals(t); drawCapCtl(t);
        // CCTV of this room: the man who walked the ship is standing at the capsule
        feed("secmed", () => {
          const cp = R.med.dyn.CAM_secmed.getWorldPosition(new THREE.Vector3());
          secCam.position.copy(cp); secCam.fov = 70; secCam.updateProjectionMatrix();
          secCam.lookAt(B(0.4, 1.3, 0.9));
          S.hero.visible = t < 24.9; S.hero.position.copy(B(-0.08, 1.0, 0)); S.hero.rotation.set(0, (180 + 27) * DEG, 0);
        }, t, "CAM 2", red ? [1.0, 0.25, 0.2] : [0.7, 1.0, 0.95]);
        S.hero.visible = false;
        setGrade("white", "red", red ? 1 : 0);
        // eyelids getting heavy
        lid = H ? 0 : Math.max(env([[19.5, 0], [19.75, 0.75], [20.0, 0.1], [20.35, 0], [20.6, 0.92], [20.95, 0.15], [21.6, 0.05], [21.85, 0.7], [22.1, 0.1], [22.35, 0.0], [22.5, 0.6], [22.7, 0]], t), 0);
        if (H && t > 24.9 && t < 25.35) lid = 0.25 * Math.sin((t - 24.9) / 0.45 * Math.PI);
        if (G_FADE_IN(t)) fade = smooth(ramp(t, T.G1, T.G1 + 0.3));
        expo = 1.15;
        if (red) { expo = 1.35; bloom = 1.3; }
        if (t >= T.EYES && t < T.EYES + 0.08) tear = 1;
        if (t >= T.END) fade = 0;
      }
      placeCam(p, camera, roll);
      camera.updateProjectionMatrix();
      post.uniforms.uLid.value = lid; post.uniforms.uFade.value = fade; post.uniforms.uBloom.value = bloom; post.uniforms.uExpo.value = expo; post.uniforms.uGrain.value = grain;
      post.uniforms.uTear.value = tear; post.uniforms.uTearY.value = 0.2 + 0.6 * hash1(Math.floor(f / 2) * 1.7);
      post.uniforms.uFrame.value = f % 977;
      camera.layers.set(0);
      renderer.setRenderTarget(target); renderer.setClearColor(0x000000, 1); renderer.render(scene, camera);
    }
    const G_FADE_IN = (t) => t < T.G1 + 0.3;
    function liveFeed(t) {
      // a ceiling-corner camera in the quarters: the hero, phone in hand
      const keep = S.hand.visible;
      S.hand.visible = false;
      secCam.position.copy(B(-2.3, 2.0, 2.3)); secCam.fov = 75; secCam.updateProjectionMatrix(); secCam.lookAt(B(1.2, -0.4, 1.0));
      S.hero.visible = true; S.hero.position.copy(B(1.45, -0.45, 0)); S.hero.rotation.set(0, Math.PI / 2, 0);
      secCam.layers.enable(1);
      renderer.setRenderTarget(rtCam); renderer.setClearColor(0x000000, 1); renderer.render(scene, secCam);
      renderer.readRenderTargetPixels(rtCam, 0, 0, FW, FH, camBuf);
      if (!SCR.__live) SCR.__live = cnv(FW, FH)[0];
      const g = SCR.__live.getContext("2d"), img = g.createImageData(FW, FH);
      for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) { const si = ((FH - 1 - y) * FW + x) * 4, di = (y * FW + x) * 4; for (let k = 0; k < 3; k++) img.data[di + k] = clamp(Math.pow(camBuf[si + k] / 255, 0.55) * 300, 0, 255); img.data[di + 3] = 255; }
      g.putImageData(img, 0, 0);
      S.hero.visible = false; S.hand.visible = keep;
    }

    function renderAt(t) {
      if (!built) { pending = t; return; }
      t = clamp(t, 0, DUR);
      let mix = 1;
      for (const [c, d, type] of TRANS) if (type === "mix" && t >= c && t < c + d) { drawWorld(c - 1 / FPS, rtPrev); mix = smooth((t - c) / d); }
      drawWorld(t, rt);
      post.uniforms.tPrev.value = mix < 1 ? rtPrev.texture : rt.texture;
      post.uniforms.uMix.value = mix;
      brightM.uniforms.t.value = rt.texture; pass(brightM, rtB1);
      blurM.uniforms.t.value = rtB1.texture; blurM.uniforms.dir.value.set(1, 0); pass(blurM, rtB2);
      blurM.uniforms.t.value = rtB2.texture; blurM.uniforms.dir.value.set(0, 1); pass(blurM, rtB1);
      pass(post, null);
    }

    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    window.__mwDebug = { renderAt, S, R, camera, scene, SCR };
    build().then(() => {});
  </script>
